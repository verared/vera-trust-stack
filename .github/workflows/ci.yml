name: Vera Trust Stack CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-stack:
    name: Build, Tests, Boundaries & Tarball Smoke (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned vera-trust-spec commit from SPEC-PIN.json
        id: spec-pin
        run: echo "commit=$(node -p 'require("./SPEC-PIN.json").commit')" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned verared/vera-trust-spec
        uses: actions/checkout@v4
        with:
          repository: verared/vera-trust-spec
          ref: ${{ steps.spec-pin.outputs.commit }}
          path: .spec-pin-checkout

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build all 7 @verared/* packages to dist/
        run: npm run build

      - name: Verify stack boundaries, licenses, and SPEC-PIN
        run: npm run check:boundaries

      - name: Run unit and specification vector tests
        env:
          VERARED_SPEC_DIR: ${{ github.workspace }}/.spec-pin-checkout/spec
        run: npm test

      - name: Smoke test all 7 @verared/* release tarballs in isolated consumer
        run: npm run smoke:tarballs
